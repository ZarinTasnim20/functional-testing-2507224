<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>target.py playground</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;background:#f6f7fb;color:#222}
  h1{margin-bottom:.2rem} .sha{font-family:monospace;color:#666;font-size:.9rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1rem;margin-top:1.5rem}
  .card{background:#fff;border-radius:10px;padding:1rem;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .card h3{margin:0 0 .3rem;font-family:monospace} .doc{font-size:.8rem;color:#666;min-height:2.4em}
  input{width:100%;box-sizing:border-box;padding:.4rem;margin:.2rem 0;border:1px solid #ccc;border-radius:6px;font-family:monospace}
  button{margin-top:.4rem;padding:.4rem .9rem;border:0;border-radius:6px;background:#3b5bdb;color:#fff;cursor:pointer}
  .out{margin-top:.5rem;font-family:monospace;font-size:.9rem;word-break:break-all}
  .ok{color:#2b8a3e} .err{color:#c92a2a}
</style>
</head>
<body>
<h1>target.py playground</h1>
<div class="sha">Deployed commit: <span id="sha">{{ sha }}</span></div>
<p>Type Python values: <code>18</code>, <code>2.5</code>, <code>None</code>, <code>True</code>, <code>[1, 2]</code>, <code>{1, 2}</code>, <code>{"apple": 1}</code>, <code>(1, 2)</code>. Anything else is sent as text.</p>
<div class="grid">
{% for f in funcs %}
  <form class="card" data-fn="{{ f.name }}">
    <h3>{{ f.name }}</h3>
    <div class="doc">{{ f.doc }}</div>
    {% for p in f.params %}<input name="{{ p }}" placeholder="{{ p }}">{% endfor %}
    <button type="submit">Run</button>
    <div class="out"></div>
  </form>
{% endfor %}
</div>
<script>
document.querySelectorAll("form.card").forEach(form => {
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const inputs = [...form.querySelectorAll("input")];
    // drop trailing empty inputs so default arguments (greet) work
    while (inputs.length && inputs[inputs.length-1].value === "") inputs.pop();
    const args = inputs.map(i => i.value);
    const out = form.querySelector(".out");
    const r = await fetch(`/api/run/${form.dataset.fn}`, {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({args})});
    const d = await r.json();
    out.className = "out " + (d.ok ? "ok" : "err");
    out.textContent = d.ok ? `→ ${d.result}  (${d.type})` : `${d.error}: ${d.message}`;
  });
});
fetch("/health").then(r=>r.json()).then(d=>document.getElementById("sha").textContent=d.sha);
</script>
</body>
</html>
